<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0757a6">
<title>Vancouver PO Parking</title>
<style>
:root{--usps-blue:#0757a6;--usps-blue-dark:#063f7a;--usps-blue-light:#eaf3fc;--red:#c62828;--green:#168447;--ink:#17212b;--muted:#64748b;--line:#d6e0ea;--bg:#eef3f8;--shadow:0 3px 12px rgba(0,0,0,.12)}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg)}
body{padding-bottom:28px}
.app-header{background:linear-gradient(135deg,var(--usps-blue-dark),var(--usps-blue));color:#fff;padding:14px;box-shadow:0 3px 10px rgba(0,0,0,.22);position:sticky;top:0;z-index:20}
.header-row{display:flex;align-items:center;max-width:900px;margin:auto}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:40px;height:40px;border:2px solid rgba(255,255,255,.9);border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:18px;flex:none}
.brand h1{font-size:21px;line-height:1.05;margin:0;font-weight:800}
.brand p{font-size:11px;margin:4px 0 0;opacity:.9}
.top-controls{
  max-width:900px;margin:6px auto 0;padding:0 12px;
  display:flex;align-items:center;gap:5px;
}
.top-label{font-size:12px;font-weight:900;color:var(--ink);white-space:nowrap}
.sort-choice{
  display:flex;align-items:center;gap:4px;
  border:1px solid #c8d6e5;background:#fff;color:var(--usps-blue);
  border-radius:8px;padding:7px 7px;font-size:12px;font-weight:800;
  cursor:pointer;white-space:nowrap;
}
.sort-choice input{margin:0;accent-color:var(--usps-blue)}
.compact-print{
  margin-left:auto;border:1px solid #c8d6e5;background:#fff;color:var(--usps-blue);
  border-radius:8px;padding:7px 10px;font-size:12px;font-weight:800;
  cursor:pointer;white-space:nowrap;box-shadow:0 1px 3px #0000000b;
}
.compact-print:hover{background:var(--usps-blue-light)}

</style>
</head>
<body>
<header class="app-header"><div class="header-row"><div class="brand"><div class="brand-mark">PO</div><div><h1>Vancouver PO Parking</h1><p>Vancouver, WA S&amp;DC • Route Finder reference</p></div></div></div></header>

<div class="top-controls">
  <span class="top-label">Sort by:</span>
  <label class="sort-choice"><input type="radio" name="sortOrder" value="space" checked onchange="setSort('space')"> Space #</label>
  <label class="sort-choice"><input type="radio" name="sortOrder" value="route" onchange="setSort('route')"> Route</label>
  <button class="compact-print" id="printToggle" onclick="togglePrintOptions()">🖨 Print</button>
</div>

<div class="action-options print-options" id="printOptions">
  <span class="print-label">Print:</span>
  <label><input type="radio" name="printScope" value="selected" checked onchange="setPrintScope('selected')"> Selected ZIP</label>
  <label><input type="radio" name="printScope" value="office" onchange="setPrintScope('office')"> Whole Office</label>
</div>

<div class="search"><input id="search" type="search" placeholder="Search space #, route, or vehicle number…"></div>
<div class="tabs" id="tabs"></div>
<div class="status" id="status"></div>
<main id="content"></main>

<div class="note">Parking spaces 1–59 are South; 60 and above are North. Changes made with Edit are saved on this device/browser. Use Print for the open ZIP, or Print Whole Office for all ZIPs.</div>

<script>
/* MASTER ROUTE DATA */
const originalData = {
 "98660":[["C03",59,""],["C05",58,""],["C07",57,""],["C08",56,""],["C09",17,""],["C10",18,""],["C19",19,""],["C21",16,""],["C23",15,""],["C44",14,""],["C47",13,""]],
 "98661":[["C27",44,""],["C41",41,""],["C45",40,""],["C46",39,""],["C48",38,""],["C52",37,""],["C60",32,""],["C64",33,""],["C71",34,""],["C72",36,""],["C73",35,""],["C16",65,""],["C17",66,""],["C19",67,""],["C20",68,""],["C21",69,""],["C23",70,""],["C25",71,""],["C31",43,""],["C35",42,""]],
 "98663":[["C01",9,""],["C11",10,""],["C12",11,""],["C13",12,""],["C14",22,""],["C15",21,""],["C16",20,""],["C17",55,""],["C18",54,""],["C20",53,""]],
 "98665":[["C24",45,""],["C79",46,""],["C83",47,""],["C85",48,""],["C88",31,""],["C89",30,""],["C91",29,""],["C92",28,""],["C93",1,""],["C94",2,""],["C97",3,""],["C98",4,""],["C99",5,""],["C100",6,""],["C101",7,""]],
 "98685":[["R27",81,""],["R28",82,""],["R35",83,""],["C95",8,""],["C90",25,""],["C87",26,""],["C82",27,""],["C37",49,""],["C78",50,""],["R29",73,""],["R08",74,""],["R09",75,""],["R10",76,""],["R17",77,""],["R18",78,""],["R20",79,""],["R25",80,""]],
 "98686":[["R06",60,""],["R07",61,""],["R16",62,""],["R19",63,""],["R26",64,""],["R30",72,""],["R45",84,""],["C80",23,""],["C36",24,""],["C86",51,""],["C96",52,""]]
};

const key="vancouverPOParkingData_v3";
const legacyKey="vancouverPOParkingData";
let data=loadData(),active=Object.keys(data)[0],editing=false,draft=null,sortBy="space",printScope="selected";

function clone(o){return JSON.parse(JSON.stringify(o))}

function loadData(){
 const master=clone(originalData);
 try{
  let raw=localStorage.getItem(key);
  if(!raw)raw=localStorage.getItem(legacyKey);
  if(raw){
   const saved=JSON.parse(raw);
   for(const zip of Object.keys(master)){
    const savedRows=Array.isArray(saved[zip])?saved[zip]:[];
    const vehicles=new Map(savedRows.map(r=>[String(r?.[0]??"").trim().toUpperCase(),String(r?.[2]??"")]));
    master[zip]=master[zip].map(r=>[r[0]??"",r[1]??"",vehicles.has(String(r[0]??"").trim().toUpperCase())?vehicles.get(String(r[0]??"").trim().toUpperCase()):(r[2]??"")]);
   }
  }
 }catch(e){}
 return master;
}

function hideActionOptions(){document.getElementById("editOptions").classList.remove("show");document.getElementById("printOptions").classList.remove("show")}

function togglePrintOptions(){
 const p=document.getElementById("printOptions"),shown=p.classList.contains("show");
 document.getElementById("editOptions").classList.remove("show");
 if(shown){if(printScope==="office")printOffice();else printSelectedZip()}
 else p.classList.add("show");
}

function setSort(mode){sortBy=mode;const r=document.querySelector(`input[name="sortOrder"][value="${mode}"]`);if(r)r.checked=true;render()}
function printSelectedZip(){hideActionOptions();window.print()}
function setPrintScope(mode){printScope=mode;const r=document.querySelector(`input[name="printScope"][value="${mode}"]`);if(r)r.checked=true}

function printOffice(){
 hideActionOptions();
 document.body.classList.add("print-office");
 renderAllForPrint();
 setTimeout(()=>window.print(),50);
}

function renderAllForPrint(){
 const source=editing?draft:data,allRows=[];
 Object.keys(source).forEach(zip=>(source[zip]||[]).forEach(row=>allRows.push({zip,route:row[0]??"",space:row[1]??"",vehicle:row[2]??""})));
 allRows.sort((a,b)=>{
  const an=parseInt(a.space,10),bn=parseInt(b.space,10);
  if(!isNaN(an)&&!isNaN(bn))return an-bn;
  if(!isNaN(an))return -1;if(!isNaN(bn))return 1;
  return String(a.space).localeCompare(String(b.space),undefined,{numeric:true,sensitivity:"base"});
 });
 document.getElementById("content").innerHTML=`<section class="panel zip-panel"><div class="panel-head"><h2>Vancouver PO Parking — Whole Office</h2><span class="count">${allRows.length} parking spaces</span></div><div class="table-wrap"><table><thead><tr><th>Space #</th><th>Route</th><th>ZIP</th><th>Vehicle Number</th></tr></thead><tbody>${allRows.map(item=>`<tr><td><strong class="space-number">${item.space===""?"":esc(item.space)}</strong></td><td><strong class="route-number">${esc(item.route)}</strong></td><td><strong>${esc(item.zip)}</strong></td><td><span class="vehicle-number">${item.vehicle===""?"":esc(item.vehicle)}</span></td></tr>`).join("")}</tbody></table></div></section>`;
 window.addEventListener("afterprint",restoreAfterPrint,{once:true});
}

function restoreAfterPrint(){document.body.classList.remove("print-office");renderTabs();render()}
function setStatus(msg){document.getElementById("status").textContent=msg||"";if(msg)setTimeout(()=>document.getElementById("status").textContent="",2200)}
function renderTabs(){document.getElementById("tabs").innerHTML=Object.keys(data).map(zip=>`<button class="tab ${zip===active?"active":""}" onclick="setZip('${zip}')">${zip}</button>`).join("")}
function setZip(zip){active=zip;renderTabs();render()}


function render(){
  const q=document.getElementById("search").value.trim().toUpperCase();
  const source=data;
  const zips=q?Object.keys(source):[active];

  const sections=zips.map(zip=>{
    const allRows=source[zip]||[];
    let rows=q
      ?allRows.map((row,index)=>({row,index})).filter(({row})=>{
        return String(row[0]??"").toUpperCase().includes(q) ||
               String(row[1]??"").toUpperCase().includes(q) ||
               String(row[2]??"").toUpperCase().includes(q);
      })
      :allRows.map((row,index)=>({row,index}));

    rows.sort((a,b)=>{
      const av=sortBy==="route"?String(a.row[0]??""):String(a.row[1]??"");
      const bv=sortBy==="route"?String(b.row[0]??""):String(b.row[1]??"");
      const an=parseInt(av,10),bn=parseInt(bv,10);
      if(!isNaN(an)&&!isNaN(bn)&&an!==bn)return an-bn;
      return av.localeCompare(bv,undefined,{numeric:true,sensitivity:"base"});
    });

    if(q&&!rows.length)return "";

    return `<section class="panel zip-panel">
      <div class="panel-head"><h2>ZIP ${esc(zip)}</h2><span class="count">${rows.length} parking space${rows.length===1?'':'s'}</span></div>
      ${rows.length?`<div class="table-wrap"><table>
        <colgroup><col style="width:23%"><col style="width:23%"><col style="width:46%"></colgroup>
        <thead><tr><th>Space #</th><th>Route</th><th>Vehicle Number</th></tr></thead>
        <tbody>${rows.map(({row})=>{
          const route=String(row[0]??"");
          const space=String(row[1]??"");
          const vehicle=String(row[2]??"");
          return `<tr>
            <td><strong class="space-number">${space===""?'':esc(space)}</strong></td>
            <td><strong class="route-number">${esc(route)}</strong></td>
            <td><span class="vehicle-number">${vehicle===""?'':esc(vehicle)}</span></td>
          </tr>`;
        }).join("")}</tbody>
      </table></div>`:`<div class="empty">No matching parking spaces.</div>`}
    </section>`;
  }).join("");

  document.getElementById("content").innerHTML=sections||`<div class="empty">No matching parking spaces.</div>`;
}

function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function editRoute(zip,i,value){if(draft[zip]&&draft[zip][i])draft[zip][i][0]=value.trim().toUpperCase();render()}
function editSpace(zip,i,value){if(draft[zip]&&draft[zip][i])draft[zip][i][1]=value.trim();render()}
function editVehicle(zip,i,value){if(draft[zip]&&draft[zip][i])draft[zip][i][2]=value.trim();render()}
function deleteRoute(zip,i){if(!draft[zip])return;if(confirm("Delete parking space "+(draft[zip][i]?.[1]||"")+"?")){draft[zip].splice(i,1);render()}}




document.getElementById("search").addEventListener("input",render);
renderTabs();render();
</script>
</body>
</html>
