<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0757a6">
<title>Vancouver PO Parking</title>
<style>
:root{
  --usps-blue:#0757a6;
  --usps-blue-dark:#063f7a;
  --usps-blue-light:#eaf3fc;
  --red:#c62828;
  --green:#168447;
  --ink:#17212b;
  --muted:#64748b;
  --line:#d6e0ea;
  --bg:#eef3f8;
  --white:#fff;
  --shadow:0 3px 12px rgba(0,0,0,.12);
}
*{box-sizing:border-box}
html,body{
  margin:0;padding:0;min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--ink);background:var(--bg)
}
body{padding-bottom:28px}

/* Header */
.app-header{
  background:linear-gradient(135deg,var(--usps-blue-dark),var(--usps-blue));
  color:#fff;
  padding:14px 14px 13px;
  box-shadow:0 3px 10px rgba(0,0,0,.22);
  position:sticky;top:0;z-index:20;
}
.header-row{
  display:flex;align-items:center;
  max-width:900px;margin:auto;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{
  width:40px;height:40px;
  border:2px solid rgba(255,255,255,.9);
  border-radius:50%;
  display:grid;place-items:center;
  font-weight:900;font-size:18px;flex:none;
}
.brand h1{font-size:21px;line-height:1.05;margin:0;font-weight:800}
.brand p{font-size:11px;margin:4px 0 0;opacity:.9}

/* Top controls: Sort + Print on one row */
.top-controls{
  max-width:900px;
  margin:6px auto 0;
  padding:0 12px;
  display:flex;
  align-items:center;
  gap:5px;
  min-width:0;
}
.top-label{
  font-size:12px;
  font-weight:900;
  color:var(--ink);
  white-space:nowrap;
}
.sort-choice{
  display:flex;
  align-items:center;
  gap:4px;
  border:1px solid #c8d6e5;
  background:#fff;
  color:var(--usps-blue);
  border-radius:8px;
  padding:7px 7px;
  font-size:12px;
  font-weight:800;
  cursor:pointer;
  white-space:nowrap;
}
.sort-choice input{margin:0;accent-color:var(--usps-blue)}
.compact-print{
  margin-left:auto;
  border:1px solid #c8d6e5;
  background:#fff;
  color:var(--usps-blue);
  border-radius:8px;
  padding:7px 10px;
  font-size:12px;
  font-weight:800;
  cursor:pointer;
  white-space:nowrap;
  box-shadow:0 1px 3px #0000000b;
}
.compact-print:hover{background:var(--usps-blue-light)}

/* Print options */
.action-options{
  max-width:900px;
  margin:4px auto 0;
  padding:0 12px;
  display:none;
  gap:6px;
}
.action-options.show{display:grid}
.print-options{
  align-items:center;
  grid-template-columns:auto auto auto;
}
.print-label{
  font-size:12px;
  font-weight:900;
  color:var(--ink);
  white-space:nowrap;
}
.print-options label{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  border:1px solid #c8d6e5;
  background:#fff;
  color:var(--usps-blue);
  border-radius:8px;
  padding:7px 8px;
  font-size:12px;
  font-weight:800;
  cursor:pointer;
  white-space:nowrap;
}
.print-options input{margin:0;accent-color:var(--usps-blue)}
.print-options label:hover{background:var(--usps-blue-light)}

/* Search */
.search{
  max-width:900px;
  margin:6px auto 0;
  padding:0 12px;
}
.search input{
  width:100%;
  height:42px;
  border:1px solid #c8d6e5;
  border-radius:10px;
  background:#fff;
  padding:0 13px;
  font-size:15px;
  outline:none;
  box-shadow:0 1px 3px #0000000b;
}
.search input:focus{
  border-color:var(--usps-blue);
  box-shadow:0 0 0 3px #0757a61a;
}

/* ZIP tabs */
.tabs{
  max-width:900px;
  margin:7px auto 0;
  padding:0 12px;
  display:flex;
  gap:5px;
  overflow-x:auto;
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;
  border:1px solid #c7d7e8;
  border-bottom:0;
  background:#dbe9f7;
  color:#24527c;
  border-radius:9px 9px 0 0;
  padding:10px 14px;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
}
.tab.active{
  background:#fff;
  color:var(--usps-blue);
  padding-top:11px;
}

/* Main table */
main{
  max-width:900px;
  margin:0 auto;
  padding:0 12px;
}
.panel{
  background:#fff;
  border:1px solid var(--line);
  border-radius:0 11px 11px 11px;
  overflow:hidden;
  box-shadow:var(--shadow);
}
.panel-head{
  padding:13px 14px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.panel-head h2{
  margin:0;
  color:var(--usps-blue-dark);
  font-size:20px;
}
.count{
  font-size:12px;
  color:var(--muted);
  font-weight:700;
}
.table-wrap{overflow-x:auto}
table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
  min-width:0;
}
th,td{
  padding:10px 8px;
  border-bottom:1px solid #e5ebf2;
  text-align:left;
  overflow:hidden;
}
th:nth-child(1),td:nth-child(1){width:23%}
th:nth-child(2),td:nth-child(2){width:23%}
th:nth-child(3),td:nth-child(3){width:54%}
th{
  background:#f1f6fb;
  color:#34516c;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.04em;
}
td{font-size:15px}
tr:last-child td{border-bottom:0}
.space-number,.route-number{
  font-size:18px;
  font-weight:900;
}
.vehicle-number{font-weight:700}
.empty{
  padding:30px;
  text-align:center;
  color:var(--muted);
}
.status{
  max-width:900px;
  margin:8px auto 0;
  padding:0 12px;
  color:var(--green);
  font-size:12px;
  font-weight:700;
  min-height:16px;
}
.note{
  max-width:900px;
  margin:12px auto 0;
  padding:0 12px;
  color:var(--muted);
  font-size:11px;
  line-height:1.4;
}

@media(max-width:520px){
  .top-controls{gap:4px}
  .top-label{font-size:12px}
  .sort-choice{padding:7px 6px}
  .compact-print{padding:7px 9px}
  .action-options{
    width:100%;
    grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);
    gap:5px;
  }
  .print-options label{
    padding:7px 6px;
    font-size:12px;
  }
}

@media print{
  body{
    background:#fff;
    padding:0;
  }
  .app-header{
    position:static;
    background:#fff;
    color:#000;
    box-shadow:none;
    border-bottom:2px solid #000;
  }
  .brand-mark{border-color:#000}
  .brand p{color:#444}
  .top-controls,.search,.tabs,.status,.note,.action-options{
    display:none!important;
  }
  main{
    max-width:none;
    padding:0;
  }
  .panel{
    border:0;
    box-shadow:none;
    border-radius:0;
  }
  .panel-head{padding:8px 0}
  th{background:#eee!important}
  table{min-width:0}
  .print-office .panel-head{padding-top:4px}
}
</style>
</head>
<body>

<header class="app-header">
  <div class="header-row">
    <div class="brand">
      <div class="brand-mark">PO</div>
      <div>
        <h1>Vancouver PO Parking</h1>
        <p>Vancouver, WA S&amp;DC • Route Finder reference</p>
      </div>
    </div>
  </div>
</header>

<div class="top-controls">
  <span class="top-label">Sort by:</span>
  <label class="sort-choice">
    <input type="radio" name="sortOrder" value="space" checked onchange="setSort('space')">
    Space #
  </label>
  <label class="sort-choice">
    <input type="radio" name="sortOrder" value="route" onchange="setSort('route')">
    Route
  </label>
  <button class="compact-print" id="printToggle" onclick="togglePrintOptions()">🖨 Print</button>
</div>

<div class="action-options print-options" id="printOptions">
  <span class="print-label">Print:</span>
  <label>
    <input type="radio" name="printScope" value="selected" checked onchange="setPrintScope('selected')">
    Selected ZIP
  </label>
  <label>
    <input type="radio" name="printScope" value="office" onchange="setPrintScope('office')">
    Whole Office
  </label>
</div>

<div class="search">
  <input id="search" type="search" placeholder="Search space #, route, or vehicle number…">
</div>

<div class="tabs" id="tabs"></div>
<div class="status" id="status"></div>
<main id="content"></main>

<div class="note">
  Parking spaces 1–59 are South; 60 and above are North.
  Changes made with Edit are saved on this device/browser.
  Use Print for the open ZIP, or Print Whole Office for all ZIPs.
</div>

<script>
/* MASTER ROUTE DATA */
const originalData = {
  "98660":[
    ["C03",59,""],["C05",58,""],["C07",57,""],["C08",56,""],
    ["C09",17,""],["C10",18,""],["C19",19,""],["C21",16,""],
    ["C23",15,""],["C44",14,""],["C47",13,""]
  ],
  "98661":[
    ["C27",44,""],["C41",41,""],["C45",40,""],["C46",39,""],
    ["C48",38,""],["C52",37,""],["C60",32,""],["C64",33,""],
    ["C71",34,""],["C72",36,""],["C73",35,""],["C16",65,""],
    ["C17",66,""],["C19",67,""],["C20",68,""],["C21",69,""],
    ["C23",70,""],["C25",71,""],["C31",43,""],["C35",42,""]
  ],
  "98663":[
    ["C01",9,""],["C11",10,""],["C12",11,""],["C13",12,""],
    ["C14",22,""],["C15",21,""],["C16",20,""],["C17",55,""],
    ["C18",54,""],["C20",53,""]
  ],
  "98665":[
    ["C24",45,""],["C79",46,""],["C83",47,""],["C85",48,""],
    ["C88",31,""],["C89",30,""],["C91",29,""],["C92",28,""],
    ["C93",1,""],["C94",2,""],["C97",3,""],["C98",4,""],
    ["C99",5,""],["C100",6,""],["C101",7,""]
  ],
  "98685":[
    ["R27",81,""],["R28",82,""],["R35",83,""],["C95",8,""],
    ["C90",25,""],["C87",26,""],["C82",27,""],["C37",49,""],
    ["C78",50,""],["R29",73,""],["R08",74,""],["R09",75,""],
    ["R10",76,""],["R17",77,""],["R18",78,""],["R20",79,""],
    ["R25",80,""]
  ],
  "98686":[
    ["R06",60,""],["R07",61,""],["R16",62,""],["R19",63,""],
    ["R26",64,""],["R30",72,""],["R45",84,""],["C80",23,""],
    ["C36",24,""],["C86",51,""],["C96",52,""]
  ]
};

const key="vancouverPOParkingData_v3";
const legacyKey="vancouverPOParkingData";

let data=loadData();
let active=Object.keys(data)[0];
let sortBy="space";
let printScope="selected";

function clone(o){
  return JSON.parse(JSON.stringify(o));
}

function loadData(){
  const master=clone(originalData);
  try{
    let raw=localStorage.getItem(key);
    if(!raw) raw=localStorage.getItem(legacyKey);

    if(raw){
      const saved=JSON.parse(raw);

      /* Preserve only previously entered vehicle numbers.
         The hardwired master above controls routes and spaces. */
      for(const zip of Object.keys(master)){
        const savedRows=Array.isArray(saved[zip]) ? saved[zip] : [];
        const vehicles=new Map(
          savedRows.map(r=>[
            String(r?.[0] ?? "").trim().toUpperCase(),
            String(r?.[2] ?? "")
          ])
        );

        master[zip]=master[zip].map(r=>[
          r[0] ?? "",
          r[1] ?? "",
          vehicles.has(String(r[0] ?? "").trim().toUpperCase())
            ? vehicles.get(String(r[0] ?? "").trim().toUpperCase())
            : (r[2] ?? "")
        ]);
      }
    }
  }catch(e){}
  return master;
}

function setSort(mode){
  sortBy=mode;
  const radio=document.querySelector(
    `input[name="sortOrder"][value="${mode}"]`
  );
  if(radio) radio.checked=true;
  render();
}

function togglePrintOptions(){
  const p=document.getElementById("printOptions");
  const shown=p.classList.contains("show");

  if(shown){
    if(printScope==="office"){
      printOffice();
    }else{
      printSelectedZip();
    }
  }else{
    p.classList.add("show");
  }
}

function hidePrintOptions(){
  document.getElementById("printOptions").classList.remove("show");
}

function setPrintScope(mode){
  printScope=mode;
  const radio=document.querySelector(
    `input[name="printScope"][value="${mode}"]`
  );
  if(radio) radio.checked=true;
}

function printSelectedZip(){
  hidePrintOptions();
  document.body.classList.remove("print-office");
  render();
  window.print();
}

/*
  WHOLE OFFICE PRINT:
  One continuous list.
  NOT separated by ZIP.
  Always sorted by parking-space number.
*/
function printOffice(){
  hidePrintOptions();
  document.body.classList.add("print-office");

  const allRows=[];

  Object.keys(data).forEach(zip=>{
    (data[zip] || []).forEach(row=>{
      allRows.push({
        zip:zip,
        route:row[0] ?? "",
        space:row[1] ?? "",
        vehicle:row[2] ?? ""
      });
    });
  });

  allRows.sort((a,b)=>{
    const an=parseInt(a.space,10);
    const bn=parseInt(b.space,10);

    if(!isNaN(an) && !isNaN(bn)){
      if(an!==bn) return an-bn;
      return String(a.route).localeCompare(
        String(b.route),undefined,{numeric:true,sensitivity:"base"}
      );
    }
    if(!isNaN(an)) return -1;
    if(!isNaN(bn)) return 1;

    return String(a.space).localeCompare(
      String(b.space),undefined,{numeric:true,sensitivity:"base"}
    );
  });

  document.getElementById("content").innerHTML=`
    <section class="panel">
      <div class="panel-head">
        <h2>Vancouver PO Parking — Whole Office</h2>
        <span class="count">${allRows.length} parking spaces</span>
      </div>
      <div class="table-wrap">
        <table>
          <colgroup>
            <col style="width:17%">
            <col style="width:23%">
            <col style="width:18%">
            <col style="width:42%">
          </colgroup>
          <thead>
            <tr>
              <th>Space #</th>
              <th>Route</th>
              <th>ZIP</th>
              <th>Vehicle Number</th>
            </tr>
          </thead>
          <tbody>
            ${allRows.map(item=>`
              <tr>
                <td><strong class="space-number">${item.space===""?"":esc(item.space)}</strong></td>
                <td><strong class="route-number">${esc(item.route)}</strong></td>
                <td><strong>${esc(item.zip)}</strong></td>
                <td><span class="vehicle-number">${item.vehicle===""?"":esc(item.vehicle)}</span></td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
    </section>
  `;

  window.addEventListener("afterprint",restoreAfterPrint,{once:true});
  setTimeout(()=>window.print(),50);
}

function restoreAfterPrint(){
  document.body.classList.remove("print-office");
  renderTabs();
  render();
}

function setStatus(msg){
  document.getElementById("status").textContent=msg || "";
  if(msg){
    setTimeout(()=>{
      document.getElementById("status").textContent="";
    },2200);
  }
}

function renderTabs(){
  document.getElementById("tabs").innerHTML=
    Object.keys(data).map(zip=>`
      <button
        class="tab ${zip===active ? "active" : ""}"
        onclick="setZip('${zip}')"
      >${zip}</button>
    `).join("");
}

function setZip(zip){
  active=zip;
  renderTabs();
  render();
}

function render(){
  const q=document.getElementById("search").value.trim().toUpperCase();
  const zips=q ? Object.keys(data) : [active];

  const sections=zips.map(zip=>{
    const allRows=data[zip] || [];

    let rows=q
      ? allRows.map((row,index)=>({row,index})).filter(({row})=>{
          return String(row[0] ?? "").toUpperCase().includes(q) ||
                 String(row[1] ?? "").toUpperCase().includes(q) ||
                 String(row[2] ?? "").toUpperCase().includes(q);
        })
      : allRows.map((row,index)=>({row,index}));

    rows.sort((a,b)=>{
      const av=sortBy==="route"
        ? String(a.row[0] ?? "")
        : String(a.row[1] ?? "");
      const bv=sortBy==="route"
        ? String(b.row[0] ?? "")
        : String(b.row[1] ?? "");

      if(sortBy==="space"){
        const an=parseInt(av,10);
        const bn=parseInt(bv,10);

        if(!isNaN(an) && !isNaN(bn) && an!==bn) return an-bn;
        if(!isNaN(an) && isNaN(bn)) return -1;
        if(isNaN(an) && !isNaN(bn)) return 1;
      }

      return av.localeCompare(
        bv,undefined,{numeric:true,sensitivity:"base"}
      );
    });

    if(q && !rows.length) return "";

    return `
      <section class="panel zip-panel">
        <div class="panel-head">
          <h2>ZIP ${esc(zip)}</h2>
          <span class="count">
            ${rows.length} parking space${rows.length===1 ? "" : "s"}
          </span>
        </div>

        ${
          rows.length
          ? `
            <div class="table-wrap">
              <table>
                <colgroup>
                  <col style="width:23%">
                  <col style="width:23%">
                  <col style="width:54%">
                </colgroup>
                <thead>
                  <tr>
                    <th>Space #</th>
                    <th>Route</th>
                    <th>Vehicle Number</th>
                  </tr>
                </thead>
                <tbody>
                  ${rows.map(({row})=>{
                    const route=String(row[0] ?? "");
                    const space=String(row[1] ?? "");
                    const vehicle=String(row[2] ?? "");

                    return `
                      <tr>
                        <td>
                          <strong class="space-number">
                            ${space==="" ? "" : esc(space)}
                          </strong>
                        </td>
                        <td>
                          <strong class="route-number">${esc(route)}</strong>
                        </td>
                        <td>
                          <span class="vehicle-number">
                            ${vehicle==="" ? "" : esc(vehicle)}
                          </span>
                        </td>
                      </tr>
                    `;
                  }).join("")}
                </tbody>
              </table>
            </div>
          `
          : `<div class="empty">No matching parking spaces.</div>`
        }
      </section>
    `;
  }).join("");

  document.getElementById("content").innerHTML=
    sections || `<div class="empty">No matching parking spaces.</div>`;
}

function esc(v){
  return String(v ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

document.getElementById("search").addEventListener("input",render);

renderTabs();
render();
</script>
</body>
</html>
